<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REO</title>
<style>
  :root {
    --bg: #04070b;
    --accent: #2b8fa8;
    --accent-soft: #2b8fa840;
    --text: #c6dcee;
    --muted: #51687d;
    --edge: #16293a;
    /* One number drives every ring: the state sets it, each ring multiplies it. */
    --beat: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace;
    height: 100vh;
    overflow: hidden;
    background-image: radial-gradient(ellipse at 30% 50%, #091420 0%, var(--bg) 64%);
  }

  .frame { position: fixed; inset: 18px; pointer-events: none; }
  .frame span { position: absolute; width: 54px; height: 54px; border: 1px solid var(--edge); }
  .frame span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .frame span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .frame span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .frame span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  header {
    position: fixed; top: 34px; left: 46px; right: 46px;
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--edge); padding-bottom: 14px;
  }
  h1 { font-size: 23px; letter-spacing: .42em; font-weight: 700; }
  h1 em { color: var(--accent); font-style: normal; }
  .sub { color: var(--muted); font-size: 10px; letter-spacing: .22em; margin-top: 5px; }
  .clock { font-size: 19px; text-align: right; }
  .date { color: var(--muted); font-size: 10px; letter-spacing: .18em; text-align: right; }

  main {
    position: fixed; inset: 110px 46px 56px 46px;
    display: grid; grid-template-columns: minmax(360px, 34%) 1fr 212px; gap: 34px;
  }

  /* ---- the instrument -------------------------------------------------
     Rings are SVG strokes, not stacked divs. Every circle carries
     pathLength="360", which makes stroke-dasharray read in degrees: "1 2"
     is 120 ticks whatever the radius, so the geometry needs no arithmetic
     and stays crisp at any window size.

     Nothing blurred or shadowed is ever animated. That was the old
     reactor's real cost: a 34px blur and two large box-shadows were being
     re-rasterised every frame because the elements carrying them were
     scaling. Here the glow is a gradient painted once, and the only
     animated property is transform, which the compositor handles alone. */
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg.dial { width: min(100%, 430px); height: auto; overflow: visible; }

  .dial circle, .dial line, .dial path, .dial polyline { fill: none; vector-effect: non-scaling-stroke; }

  /* Paint that follows the accent has to be set in CSS, not as an SVG
     attribute: var() is not substituted in presentation attributes, so
     fill="var(--accent)" silently painted nothing. */
  .dial .filled { fill: var(--accent); stroke: none; }
  .dial .filled.faint { fill-opacity: .14; }
  .dial .hot { fill: #eaf9ff; stroke: none; }
  #glow stop, #fade stop { stop-color: var(--accent); }

  .spin {
    transform-box: view-box; transform-origin: center;
    animation: turn var(--period) linear infinite;
    will-change: transform;
  }
  .spin.back { animation-name: turn-back; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes turn-back { to { transform: rotate(-360deg); } }

  /* Scale only. Opacity and transform are the two properties that never
     force a repaint, and the glow behind this is a separate static layer. */
  .core { transform-box: view-box; transform-origin: center;
          animation: beat calc(2.6s / var(--beat)) ease-in-out infinite; will-change: transform; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }

  .dim    { stroke: var(--edge); }
  .mid    { stroke: var(--accent); opacity: .42; }
  .bright { stroke: var(--accent); }
  .tick   { stroke: var(--accent); opacity: .55; }
  .mark   { fill: var(--muted); font-size: 9px; letter-spacing: .14em; stroke: none; }

  .state {
    margin-top: 22px; letter-spacing: .3em; font-weight: 700; font-size: 14px;
    color: var(--accent);
  }

  /* ---- transcript ---- */
  .label { color: var(--muted); font-size: 10px; letter-spacing: .24em; }
  .panel-head { border-bottom: 1px solid var(--edge); padding-bottom: 7px; margin-bottom: 14px; }
  #log { overflow: hidden; display: flex; flex-direction: column; gap: 9px; }
  .line { display: grid; grid-template-columns: 42px 1fr; gap: 6px; animation: rise .22s ease-out; }
  .line .who { color: var(--muted); font-size: 10px; padding-top: 2px; }
  .line.reo .what { color: var(--accent); }
  .line.note .what { color: var(--muted); font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

  /* ---- system panel ---- */
  .stat { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; }
  .stat b { color: var(--accent); font-weight: 600; }
  .bar { height: 2px; background: #10202d; margin: 3px 0 9px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .group { margin-bottom: 20px; }

  footer {
    position: fixed; left: 46px; bottom: 26px;
    color: var(--muted); font-size: 9px; letter-spacing: .2em;
  }

  @media (prefers-reduced-motion: reduce) {
    .spin, .core, .line { animation: none; }
  }
</style>
</head>
<body>
  <div class="frame"><span></span><span></span><span></span><span></span></div>

  <header>
    <div>
      <h1>R E <em>O</em></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main>
    <div class="stage">
      <svg class="dial" viewBox="0 0 400 400" aria-hidden="true">
        <defs>
          <!-- Painted once. A blur filter here would be re-rasterised on
               every frame of anything moving above it. -->
          <radialGradient id="glow">
            <stop offset="0%"   stop-opacity=".5"/>
            <stop offset="45%"  stop-opacity=".14"/>
            <stop offset="100%" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-opacity="0"/>
            <stop offset="100%" stop-opacity=".9"/>
          </linearGradient>
        </defs>

        <circle cx="200" cy="200" r="96" fill="url(#glow)" stroke="none"/>

        <!-- outer bezel and its graduations: 120 fine ticks, one path -->
        <circle class="dim"  cx="200" cy="200" r="180" stroke-width="1"/>
        <g class="spin" style="--period: calc(150s / var(--beat))">
          <circle class="tick" cx="200" cy="200" r="170" stroke-width="7"
                  pathLength="360" stroke-dasharray="0.5 2.5"/>
        </g>

        <!-- compass marks, outside everything that turns -->
        <text class="mark" x="200" y="200" text-anchor="middle"
              transform="translate(0,-192)">000</text>
        <text class="mark" x="200" y="200" text-anchor="middle"
              transform="translate(196,4)">090</text>
        <text class="mark" x="200" y="200" text-anchor="middle"
              transform="translate(0,200)">180</text>
        <text class="mark" x="200" y="200" text-anchor="middle"
              transform="translate(-196,4)">270</text>

        <!-- four bearing brackets, counter-rotating -->
        <g class="spin back" style="--period: calc(74s / var(--beat))">
          <circle class="mid" cx="200" cy="200" r="156" stroke-width="3"
                  pathLength="360" stroke-dasharray="74 16"/>
        </g>

        <!-- mid dashed ring -->
        <g class="spin" style="--period: calc(46s / var(--beat))">
          <circle class="mid" cx="200" cy="200" r="140" stroke-width="1"
                  pathLength="360" stroke-dasharray="3 9"/>
        </g>

        <!-- three calipers: the part that reads as machinery turning -->
        <g class="spin back" style="--period: calc(28s / var(--beat))">
          <circle class="bright" cx="200" cy="200" r="127" stroke-width="5"
                  pathLength="360" stroke-dasharray="34 86" opacity=".85"/>
        </g>

        <circle class="dim" cx="200" cy="200" r="114" stroke-width="1"/>

        <!-- 24 coarse graduations -->
        <g class="spin" style="--period: calc(96s / var(--beat))">
          <circle class="tick" cx="200" cy="200" r="105" stroke-width="9"
                  pathLength="360" stroke-dasharray="0.8 14.2" opacity=".45"/>
        </g>

        <!-- the sweep: one arc with a fading stroke, the fastest thing here -->
        <g class="spin" style="--period: calc(9s / var(--beat))">
          <circle cx="200" cy="200" r="90" stroke="url(#fade)" stroke-width="2"
                  pathLength="360" stroke-dasharray="100 260"/>
        </g>

        <circle class="mid" cx="200" cy="200" r="64" stroke-width="1"/>

        <!-- reticle: crosshair with a gap, and corner brackets -->
        <g class="mid" stroke-width="1">
          <line x1="200" y1="136" x2="200" y2="162"/>
          <line x1="200" y1="238" x2="200" y2="264"/>
          <line x1="136" y1="200" x2="162" y2="200"/>
          <line x1="238" y1="200" x2="264" y2="200"/>
        </g>
        <g class="bright" stroke-width="1.5" opacity=".8">
          <polyline points="174,184 174,174 184,174"/>
          <polyline points="226,184 226,174 216,174"/>
          <polyline points="174,216 174,226 184,226"/>
          <polyline points="226,216 226,226 216,226"/>
        </g>

        <!-- the core: scale only, no shadow to re-rasterise -->
        <g class="core">
          <circle class="filled faint" cx="200" cy="200" r="28"/>
          <circle class="bright" cx="200" cy="200" r="28" stroke-width="1.5"/>
          <circle class="filled" cx="200" cy="200" r="12"/>
          <circle class="hot" cx="200" cy="200" r="5.5"/>
        </g>
      </svg>
      <div class="state" id="state">IDLE</div>
    </div>

    <div>
      <div class="panel-head label">TRANSCRIPT</div>
      <div id="log"></div>
    </div>

    <div>
      <div class="panel-head label">SYSTEM</div>
      <div class="group" id="session"></div>
      <div class="panel-head label">DEVICE</div>
      <div class="group" id="device"></div>
    </div>
  </main>

  <footer>ESC WINDOWED &nbsp;&nbsp;&nbsp; CTRL+Q CLOSE &nbsp;&nbsp;&nbsp; SAY GOODBYE TO QUIT</footer>

<script>
// JARVIS is cyan; amber means working. One accent plus a tempo per state.
const STATES = {
  idle:      ["#2b8fa8", 1],
  listening: ["#22d3ee", 3.4],
  thinking:  ["#f2b03c", 2.2],
  speaking:  ["#8be9f7", 1.7],
};

window.reo = {
  state(name) {
    const [colour, beat] = STATES[name] || STATES.idle;
    const root = document.documentElement.style;
    root.setProperty("--accent", colour);
    root.setProperty("--accent-soft", colour + "40");
    root.setProperty("--beat", beat);
    document.getElementById("state").textContent = name.toUpperCase();
  },
  line(who, text) {
    const log = document.getElementById("log");
    const row = document.createElement("div");
    row.className = "line " + who;
    const label = who === "you" ? "YOU" : who === "reo" ? "REO" : "";
    row.innerHTML = `<div class="who"></div><div class="what"></div>`;
    row.children[0].textContent = label;
    row.children[1].textContent = text;
    log.appendChild(row);
    while (log.children.length > 15) log.removeChild(log.firstChild);
  },
  subtitle(text) { document.getElementById("subtitle").textContent = text.toUpperCase(); },

  // Rebuilding both panels from innerHTML eight times a second was pure
  // waste: the values change about once a second and the DOM churn was
  // competing with the animation for the same main thread. Write only
  // what actually changed.
  stats(session, device) {
    draw("session", session);
    draw("device", device);
  },
};

const drawn = {};
function draw(id, rows) {
  const key = JSON.stringify(rows);
  if (drawn[id] === key) return;
  const first = drawn[id] === undefined;
  drawn[id] = key;
  const host = document.getElementById(id);
  if (first || host.children.length !== rows.length) {
    host.innerHTML = rows.map(() =>
      `<div class="stat"><span></span><b></b></div><div class="bar" hidden><i></i></div>`
    ).join("");
  }
  rows.forEach(([k, v, pct], i) => {
    const stat = host.children[i * 2], bar = host.children[i * 2 + 1];
    stat.children[0].textContent = k;
    stat.children[1].textContent = v;
    bar.hidden = pct === undefined;
    if (pct !== undefined) bar.children[0].style.width = pct + "%";
  });
}

// Escape leaves fullscreen, Ctrl+Q closes. Without these the fullscreen
// window had no way out at all.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    window.pywebview && pywebview.api && pywebview.api.toggle_fullscreen();
  } else if (e.key === "q" && (e.ctrlKey || e.metaKey)) {
    window.pywebview && pywebview.api && pywebview.api.quit();
  }
});

// The page pulls from python rather than python pushing into the page:
// WebView2 only accepts calls on its own thread, and pushing from a worker
// filled the console with COM errors.
let polling = false;
async function poll() {
  if (polling || !window.pywebview || !pywebview.api) return;
  polling = true;
  try {
    const d = await pywebview.api.poll();
    for (const e of d.events) {
      if (e[0] === "state") reo.state(e[1]);
      else if (e[0] === "line") reo.line(e[1], e[2]);
    }
    reo.stats(d.session, d.device);
    if (d.subtitle) reo.subtitle(d.subtitle);
  } catch (err) {
    window.__pollError = String(err);   // surfaced, not swallowed
  }
  polling = false;
}
setInterval(poll, 120);

setInterval(() => {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB");
  document.getElementById("date").textContent = now.toDateString().toUpperCase();
}, 1000);
</script>
</body>
</html>
