<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>REO</title>
<style>
  :root {
    --bg: #04070b;
    --accent: #2b8fa8;
    --accent-soft: #2b8fa840;
    --text: #c6dcee;
    --muted: #51687d;
    --edge: #16293a;
    /* One number drives the whole projection: the state sets it. */
    --beat: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace;
    height: 100vh;
    overflow: hidden;
    background-image: radial-gradient(ellipse at 30% 58%, #091722 0%, var(--bg) 62%);
  }

  .frame { position: fixed; inset: 18px; pointer-events: none; }
  .frame span { position: absolute; width: 54px; height: 54px; border: 1px solid var(--edge); }
  .frame span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .frame span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .frame span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .frame span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  header {
    position: fixed; top: 34px; left: 46px; right: 46px;
    display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 1px solid var(--edge); padding-bottom: 14px;
  }
  h1 { font-size: 23px; letter-spacing: .42em; font-weight: 700; }
  h1 em { color: var(--accent); font-style: normal; }
  .sub { color: var(--muted); font-size: 10px; letter-spacing: .22em; margin-top: 5px; }
  .clock { font-size: 19px; text-align: right; }
  .date { color: var(--muted); font-size: 10px; letter-spacing: .18em; text-align: right; }

  main {
    position: fixed; inset: 110px 46px 56px 46px;
    display: grid; grid-template-columns: minmax(360px, 34%) 1fr 212px; gap: 34px;
  }

  /* ---- the projection -------------------------------------------------
     Not a wireframe. The reference is a ball of thousands of light streaks -
     city lights wrapped on a sphere - and no arrangement of tidy rings gets
     near it. So it is a canvas: a few thousand filaments generated once as
     points on a sphere, turned by a rotation matrix each frame and drawn as
     short additive strokes.

     What keeps it cheap: no shadowBlur (the expensive one), additive
     compositing for the glow instead, a capped pixel ratio, a 30fps ceiling,
     and the bloom behind it painted once in CSS rather than redrawn. The
     loop stops entirely when the window is hidden. */
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .holo { position: relative; width: 440px; height: 440px; }

  /* Painted once and never animated. A moving blur is re-rasterised every
     frame; this one just sits there. */
  .holo::before {
    content: ""; position: absolute; inset: -12%;
    background: radial-gradient(circle at 50% 50%,
      color-mix(in srgb, var(--accent) 24%, transparent) 0%,
      color-mix(in srgb, var(--accent) 7%, transparent) 38%, transparent 68%);
    pointer-events: none;
  }
  #globe { position: relative; display: block; width: 100%; height: 100%; }

  .state {
    margin-top: 10px; letter-spacing: .3em; font-weight: 700; font-size: 14px;
    color: var(--accent);
  }

  /* ---- transcript ---- */
  .label { color: var(--muted); font-size: 10px; letter-spacing: .24em; }
  .panel-head { border-bottom: 1px solid var(--edge); padding-bottom: 7px; margin-bottom: 14px; }
  #log { overflow: hidden; display: flex; flex-direction: column; gap: 9px; }
  .line { display: grid; grid-template-columns: 42px 1fr; gap: 6px; animation: rise .22s ease-out; }
  .line .who { color: var(--muted); font-size: 10px; padding-top: 2px; }
  .line.reo .what { color: var(--accent); }
  .line.note .what { color: var(--muted); font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

  /* ---- system panel ---- */
  .stat { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; }
  .stat b { color: var(--accent); font-weight: 600; }
  .bar { height: 2px; background: #10202d; margin: 3px 0 9px; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .5s; }
  .group { margin-bottom: 20px; }

  footer {
    position: fixed; left: 46px; bottom: 26px;
    color: var(--muted); font-size: 9px; letter-spacing: .2em;
  }

  @media (prefers-reduced-motion: reduce) {
    .holo, .cage, .core, .line, .scan::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="frame"><span></span><span></span><span></span><span></span></div>

  <header>
    <div>
      <h1>R E <em>O</em></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="holo"><canvas id="globe" aria-hidden="true"></canvas></div>
      <div class="state" id="state">IDLE</div>
    </div>

    <div>
      <div class="panel-head label">TRANSCRIPT</div>
      <div id="log"></div>
    </div>

    <div>
      <div class="panel-head label">SYSTEM</div>
      <div class="group" id="session"></div>
      <div class="panel-head label">DEVICE</div>
      <div class="group" id="device"></div>
    </div>
  </main>

  <footer>ESC WINDOWED &nbsp;&nbsp;&nbsp; CTRL+Q CLOSE &nbsp;&nbsp;&nbsp; SAY GOODBYE TO QUIT</footer>

<script>
// Gold, like the reference. The state shifts the hue a little and the spin a
// lot, so you can read what reo is doing without it stopping looking like one
// object. [css accent, hue, spin, heat]
const STATES = {
  idle:      ["#c8821f", 34, 1.0, 0.72],
  listening: ["#ffc24a", 42, 2.6, 1.00],
  thinking:  ["#ff7a18", 22, 1.9, 0.90],
  speaking:  ["#ffd98a", 46, 1.5, 0.95],
};
let hue = 34, spin = 1.0, heat = 0.72;

window.reo = {
  state(name) {
    const [colour, h, s, hot] = STATES[name] || STATES.idle;
    const root = document.documentElement.style;
    root.setProperty("--accent", colour);
    root.setProperty("--accent-soft", colour + "40");
    hue = h; spin = s; heat = hot;
    document.getElementById("state").textContent = name.toUpperCase();
  },
  line(who, text) {
    const log = document.getElementById("log");
    const row = document.createElement("div");
    row.className = "line " + who;
    const label = who === "you" ? "YOU" : who === "reo" ? "REO" : "";
    row.innerHTML = `<div class="who"></div><div class="what"></div>`;
    row.children[0].textContent = label;
    row.children[1].textContent = text;
    log.appendChild(row);
    while (log.children.length > 15) log.removeChild(log.firstChild);
  },
  subtitle(text) { document.getElementById("subtitle").textContent = text.toUpperCase(); },

  // Rebuilding both panels from innerHTML eight times a second was pure
  // waste: the values change about once a second and the DOM churn was
  // competing with the projection for the same main thread.
  stats(session, device) {
    draw("session", session);
    draw("device", device);
  },
};

const drawn = {};
function draw(id, rows) {
  const key = JSON.stringify(rows);
  if (drawn[id] === key) return;
  const first = drawn[id] === undefined;
  drawn[id] = key;
  const host = document.getElementById(id);
  if (first || host.children.length !== rows.length) {
    host.innerHTML = rows.map(() =>
      `<div class="stat"><span></span><b></b></div><div class="bar" hidden><i></i></div>`
    ).join("");
  }
  rows.forEach(([k, v, pct], i) => {
    const stat = host.children[i * 2], bar = host.children[i * 2 + 1];
    stat.children[0].textContent = k;
    stat.children[1].textContent = v;
    bar.hidden = pct === undefined;
    if (pct !== undefined) bar.children[0].style.width = pct + "%";
  });
}

// Escape leaves fullscreen, Ctrl+Q closes. Without these the fullscreen
// window had no way out at all.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    window.pywebview && pywebview.api && pywebview.api.toggle_fullscreen();
  } else if (e.key === "q" && (e.ctrlKey || e.metaKey)) {
    window.pywebview && pywebview.api && pywebview.api.quit();
  }
});

// The page pulls from python rather than python pushing into the page:
// WebView2 only accepts calls on its own thread, and pushing from a worker
// filled the console with COM errors.
let polling = false;
async function poll() {
  if (polling || !window.pywebview || !pywebview.api) return;
  polling = true;
  try {
    const d = await pywebview.api.poll();
    for (const e of d.events) {
      if (e[0] === "state") reo.state(e[1]);
      else if (e[0] === "line") reo.line(e[1], e[2]);
    }
    reo.stats(d.session, d.device);
    if (d.subtitle) reo.subtitle(d.subtitle);
  } catch (err) {
    window.__pollError = String(err);   // surfaced, not swallowed
  }
  polling = false;
}
setInterval(poll, 120);


// ---- the globe ------------------------------------------------------------
// Not a wireframe. The reference is a ball of thousands of light streaks, and
// no arrangement of tidy rings gets near it. So: filaments generated once as
// points on a sphere, turned about the vertical axis each frame, drawn as
// short additive strokes. Where they overlap they add up and burn to white,
// which is what lights the core without computing a single blur.
(() => {
  const canvas = document.getElementById("globe");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: true });

  // Same arrangement every run, so reo does not look different each launch.
  let seed = 20261109;
  const random = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

  const COUNT = 3400;
  const filaments = [];
  for (let i = 0; i < COUNT; i++) {
    // Fibonacci placement: evenly spread, without the clumping at the poles
    // that picking two random angles gives you.
    const y = 1 - (i / (COUNT - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const phi = i * 2.399963229728653;
    const u = [Math.cos(phi) * r, y, Math.sin(phi) * r];

    // A tangent to run along, then spun round the normal by a random amount
    // so the streaks are not all combed the same way.
    const helper = Math.abs(u[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    let tx = helper[1] * u[2] - helper[2] * u[1];
    let ty = helper[2] * u[0] - helper[0] * u[2];
    let tz = helper[0] * u[1] - helper[1] * u[0];
    const tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl; ty /= tl; tz /= tl;
    const a = random() * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const kx = u[1] * tz - u[2] * ty, ky = u[2] * tx - u[0] * tz, kz = u[0] * ty - u[1] * tx;
    const dir = [tx * ca + kx * sa, ty * ca + ky * sa, tz * ca + kz * sa];

    const spike = random() < 0.22;            // a few stand off the surface
    filaments.push({
      u, dir, spike,
      shell: 0.9 + random() * 0.16,
      // Short and fine. Long dashes read as a sparse cage; the reference is
      // closer to city lights seen from orbit.
      len: spike ? 0.04 + random() * 0.10 : 0.012 + random() * 0.075,
      bright: 0.3 + random() * 0.7,
      wide: random() < 0.10,
    });
  }

  let width = 0, height = 0;
  function fit() {
    const box = canvas.getBoundingClientRect();
    // Capping the pixel ratio matters: at 2x this is four times the fill.
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    width = Math.max(1, Math.round(box.width));
    height = Math.max(1, Math.round(box.height));
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  fit();
  addEventListener("resize", fit);

  let turn = 0, last = performance.now(), running = true, due = 0;
  const FRAME = 1000 / 30;           // 30fps is plenty here and halves the work

  function frame(now) {
    if (!running) return;
    const dt = Math.min(now - last, 100);
    last = now;
    turn += (dt / 1000) * 0.22 * spin;
    due -= dt;
    if (due <= 0) { due = FRAME; paint(); }
    requestAnimationFrame(frame);
  }

  function paint() {
    const cx = width / 2, cy = height / 2;
    const R = Math.min(width, height) * 0.40;
    const focal = 3.2;
    const cos = Math.cos(turn), sin = Math.sin(turn);

    ctx.clearRect(0, 0, width, height);
    ctx.globalCompositeOperation = "lighter";

    for (const f of filaments) {
      const ux = f.u[0], uy = f.u[1], uz = f.u[2];
      const reach = f.spike ? 1.4 : 1;
      const ex = ux + f.dir[0] * f.len * reach;
      const ey = uy + f.dir[1] * f.len * reach;
      const ez = uz + f.dir[2] * f.len * reach;

      const x1 = ux * cos + uz * sin, z1 = uz * cos - ux * sin;
      const x2 = ex * cos + ez * sin, z2 = ez * cos - ex * sin;

      const s1 = focal / (focal - z1 * f.shell);
      const s2 = focal / (focal - z2 * f.shell);
      const px1 = cx + x1 * f.shell * R * s1, py1 = cy - uy * f.shell * R * s1;
      const px2 = cx + x2 * f.shell * R * s2, py2 = cy - ey * f.shell * R * s2;

      // Depth sets brightness and warmth. The far side stays, dim, so the
      // thing reads as a volume instead of a disc.
      const depth = (z1 + 1) / 2;
      const alpha = f.bright * (0.13 + depth * depth * 1.05) * heat;
      if (alpha < 0.012) continue;
      const light = 46 + depth * 36 + (f.spike ? 12 : 0);
      // The reference rims cool where the sphere turns away; warm in front,
      // bluer at the edge, which is what gives it roundness.
      const edge = 1 - Math.abs(z1);
      const tone = hue + depth * 14 - edge * 26;
      ctx.strokeStyle = "hsla(" + tone + ", 95%, " + light + "%, " + alpha.toFixed(3) + ")";
      ctx.lineWidth = f.wide ? 1.5 : 0.65;
      ctx.beginPath();
      ctx.moveTo(px1, py1);
      ctx.lineTo(px2, py2);
      ctx.stroke();
    }

    // The swirl at the heart of it.
    for (let i = 0; i < 4; i++) {
      const rr = R * (0.12 + i * 0.07);
      const from = turn * (1.6 + i * 0.5) + i;
      ctx.strokeStyle = "hsla(" + (hue + 16) + ", 100%, " + (66 + i * 4) + "%, " + ((0.30 - i * 0.05) * heat).toFixed(3) + ")";
      ctx.lineWidth = 2.1 - i * 0.35;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, from, from + 2.1 + i * 0.3);
      ctx.stroke();
    }

    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.34);
    core.addColorStop(0, "hsla(" + (hue + 20) + ", 100%, 88%, " + (0.55 * heat).toFixed(3) + ")");
    core.addColorStop(0.45, "hsla(" + (hue + 8) + ", 100%, 60%, " + (0.20 * heat).toFixed(3) + ")");
    core.addColorStop(1, "transparent");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.34, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = "source-over";
  }

  // Nothing to draw into a window nobody can see.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      running = false;
    } else if (!running) {
      running = true; last = performance.now(); requestAnimationFrame(frame);
    }
  });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paint();
  } else {
    requestAnimationFrame(frame);
  }
})();

setInterval(() => {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB");
  document.getElementById("date").textContent = now.toDateString().toUpperCase();
}, 1000);
</script>
</body>
</html>
